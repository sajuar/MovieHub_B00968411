<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">🎬</div>
      <span class="auth-logo-text">MOVIEHUB</span>
    </div>
    <h1>Forgot Password</h1>
    <p class="auth-sub">Enter your email and we'll send you a reset link.</p>

    @if (error)   { <div class="alert alert-error">{{ error }}</div> }
    @if (success) { <div class="alert alert-success">{{ success }}</div> }

    @if (!success) {
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" [(ngModel)]="email" placeholder="your@email.com" (keyup.enter)="submit()" />
      </div>

      <button class="btn btn-primary auth-submit" (click)="submit()" [disabled]="loading">
        {{ loading ? 'Sending...' : 'Send Reset Link' }}
      </button>
    }

    <p class="auth-switch"><a routerLink="/login">← Back to Sign In</a></p>
  </div>
</div>
