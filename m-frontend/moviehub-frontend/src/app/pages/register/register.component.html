<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-logo">🎬 MovieHub</div>
    <h1>Create Account</h1>

    @if (error) {
      <div class="alert alert-error">{{ error }}</div>
    }
    @if (success) {
      <div class="alert alert-success">{{ success }}</div>
    }

    <div class="form-group">
      <label>Username</label>
      <input type="text" [(ngModel)]="username" placeholder="Choose a username" />
      <span class="field-hint">At least 3 characters, no spaces</span>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="your@email.com" />
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" placeholder="At least 6 characters" />
    </div>

    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" [(ngModel)]="confirmPassword" placeholder="Repeat password"
        (keyup.enter)="register()" />
    </div>

    <button class="btn btn-primary w-100 py-2" (click)="register()" [disabled]="loading">
      {{ loading ? 'Creating Account...' : 'Create Account' }}
    </button>

    <p class="auth-switch">
      Already have an account? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
