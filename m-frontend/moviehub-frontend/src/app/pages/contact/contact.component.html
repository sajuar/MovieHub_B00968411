<div class="page-wrap">
  <h1 class="page-title">{{ pageTitle }}</h1>
  <p class="page-sub">{{ pageSub }}</p>

  <div class="form-card">
    @if (success) { <div class="alert alert-success">{{ success }}</div> }
    @if (error)   { <div class="alert alert-error">{{ error }}</div>   }

    <div class="form-row-2">
      <div class="form-group">
        <label>Name *</label>
        <input type="text" [(ngModel)]="name" placeholder="Your name" />
      </div>
      <div class="form-group">
        <label>Email *</label>
        <input type="email" [(ngModel)]="email" placeholder="your@email.com" />
      </div>
    </div>

    <div class="form-group">
      <label>Subject</label>
      <input type="text" [(ngModel)]="subject" [placeholder]="isReport ? 'e.g. Login not working' : 'e.g. General enquiry'" />
    </div>

    <div class="form-group">
      <label>Message *</label>
      <textarea [(ngModel)]="message" rows="6" [placeholder]="placeholder"></textarea>
    </div>

    <button class="btn btn-primary send-btn" (click)="submit()" [disabled]="loading">
      {{ loading ? 'Sending...' : (isReport ? 'Submit Report' : 'Send Message') }}
    </button>
  </div>
</div>
