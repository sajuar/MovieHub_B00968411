<nav class="navbar navbar-expand-lg sticky-top" id="main-navbar">
  <div class="container-xxl">
    <a class="navbar-brand brand-link" routerLink="/">
      <span class="brand-icon">🎬</span>
      <span class="brand-text">MovieHub</span>
    </a>

    <button class="navbar-toggler border-0" type="button" (click)="mobileOpen = !mobileOpen"
      aria-label="Toggle navigation">
      ☰
    </button>

    <div class="navbar-collapse collapse" [class.show]="mobileOpen">
      <ul class="navbar-nav me-auto align-items-lg-center gap-lg-1">
        <li class="nav-item">
          <a class="nav-link" routerLink="/movies" routerLinkActive="active" (click)="mobileOpen=false">Browse</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/top-rated" routerLinkActive="active" (click)="mobileOpen=false">Top Rated</a>
        </li>
@if (isAdmin) {
          <li class="nav-item">
            <a class="nav-link" routerLink="/users" routerLinkActive="active" (click)="mobileOpen=false">Users</a>
          </li>
        }
        @if (isAdmin) {
          <li class="nav-item">
            <a class="nav-link admin-link" routerLink="/admin" routerLinkActive="active"
              (click)="mobileOpen=false">Admin</a>
          </li>
        }
      </ul>

      <div class="navbar-search mx-lg-3 my-2 my-lg-0">
        <input
          type="text"
          placeholder="Quick search..."
          [(ngModel)]="quickSearch"
          (keyup.enter)="doQuickSearch()"
          class="quick-search-input"
        />
      </div>

      <div class="navbar-auth d-flex align-items-center gap-2 my-2 my-lg-0">
        @if (isLoggedIn) {
          <a routerLink="/profile" class="username-link" (click)="mobileOpen=false">
            👤 {{ username }}@if (isAdmin) { — Admin}
          </a>
          <button class="btn btn-secondary btn-sm" (click)="logout(); mobileOpen=false">Logout</button>
        } @else {
          <a routerLink="/login" class="btn btn-secondary btn-sm" (click)="mobileOpen=false">Login</a>
          <a routerLink="/register" class="btn btn-primary btn-sm" (click)="mobileOpen=false">Register</a>
        }
      </div>
    </div>
  </div>
</nav>

<main>
  <router-outlet></router-outlet>
</main>

<footer class="site-footer">
  <div class="container-xxl">
    <p>MovieHub &copy; 2026 — COM661 Full Stack Development Project</p>
  </div>
</footer>
